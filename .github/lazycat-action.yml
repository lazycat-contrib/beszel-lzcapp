version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/beszel.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app

build:
  toolchains: []
  run_buildscript: false

images:
  # 镜像模式（delivery.mode=mirror）：只读校验，把 manifest 里的镜像改写成加速地址
  # （Docker Hub → docker.1ms.run），不把镜像搬到懒猫镜像源；因此也不能上官方商店。
  - id: app
    target: service
    service: beszel
    source: henrygd/beszel
    channel: stable
    sort: semver
    # 只跟三段式正式版本（排除 0.21 这种两段别名与 latest）
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Beszel
    summary: "Beszel 懒猫微服打包：轻量服务器监控 hub，历史指标、Docker 统计与告警；agent 装在被监控的机器上。"
